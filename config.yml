# === Log Detect 擴充設定 ===
# config_source: "yml" 時，此檔案內容會在啟動時同步至 MySQL
# devices 區段會被 devices.yml 覆蓋（如果 devices.yml 存在）

# -------------------------------------------------------
# ES 連線設定
# -------------------------------------------------------
es_connections:
  - name: "default-es"
    host: "10.99.1.213"
    port: 9200
    username: "elastic"
    password: "a12345678"
    enable_auth: true
    use_tls: true
    is_default: true
    description: "主要 ES 叢集"

# -------------------------------------------------------
# 監控目標（Targets）
# -------------------------------------------------------
targets:
  - subject: "NCKU-forti 防火牆離線告警" # 郵件主旨
    receiver:
      - "russell.chen@bimap.co"
    enable: true
    indices:
      - logname: "firewall" # 對應 history / detect API 的識別名稱
        index: "logstash-forti-group" # ES 索引名稱（支援萬用字元，如 logstash-forti-*）
        device_group: "firewall" # 對應 devices.yml 的 device_group
        field: "host.keyword" # ES 聚合用欄位
        period: "minutes" # 偵測週期單位：minutes / hours
        unit: 1 # 偵測週期數值（每 1 分鐘偵測一次）
        es_connection: "default-es" # 對應上方 es_connections 的 name


